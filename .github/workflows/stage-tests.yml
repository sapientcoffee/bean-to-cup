name: "☕ Bean-to-Cup Stage Integration Tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: "Plugin Schema & Behavioral Assertions"
    runs-on: ubuntu-latest

    steps:
    - name: "Checkout code"
      uses: actions/checkout@v4

    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: "Install Dependencies"
      run: |
        pip install pyyaml

    - name: "Run Complete Plugin Test Suite (Tiers 1, 2, and 3)"
      run: |
        python3 scripts/run_plugin_tests.py --tier all -v
